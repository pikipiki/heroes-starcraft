name: Deploy Heroes StarCraft
on:
  push:
    branches: [codex/heroes-starcraft-crossover]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read reviewed source revision
        id: revision
        run: echo "sha=$(cat source-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: pikipiki/heroes3-goonks-and-magic
          ref: ${{ steps.revision.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Test and build both games
        working-directory: source
        env:
          GOONK_ENGINE_ARCHIVE: outputs/vcmi-wasm-heroes-starcraft-engine.tar.gz
          GOONK_CROSSOVER: '1'
          GOONK_PAGES: '1'
        run: |
          npm test
          npm run prepare:web
          npm run build:web
          npm run verify:web
          npm ci --prefix experiments/crossover
          npm run build --prefix experiments/crossover
          npm test --prefix experiments/crossover
          node experiments/crossover/package.mjs
          node experiments/crossover/scripts/build-standalone.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist-heroes-starcraft
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1800000
